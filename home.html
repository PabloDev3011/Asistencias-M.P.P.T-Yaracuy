<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Inicio</title>
    <link rel="stylesheet" href="sources/css/home_styles.css" />
    <script src="sources/js/validation.js"></script>
  </head>
  <body>
    <div class="top">
      <input type="checkbox" class="menu-toggle top" id="show-menu" />
      <label for="show-menu">
        <img src="sources/img/icon/bars_menu.png" alt="menu" id="bars" />
      </label>
      <a href="index.html"
        ><img src="sources/img/icon/logout.png" alt="logout" id="log-out"
      /></a>
      <nav class="menu">
        <ul>
          <li><a href="#">Inicio</a></li>
          <li><a href="panel_reportes.html">Reportes</a></li>
          <li><a href="panel_gestion_personal.html">Gestión</a></li>
          <li><a href="pendientes.html">pendientes</a></li>
        </ul>
      </nav>
    </div>
    <div class="head">
      <h1>Panel principal</h1>
      <label for="head">Resumen de actividad</label>
    </div>
    <div class="clock-container">
      <span>Registro de hoy</span>
      <span class="date" style="color: #333">00/00/0000</span>
      <div class="clock">00:00:00</div>

      <a href="#registro-entrada" class="btn-entrada">Registrar Entrada</a>

      <a href="#registro-salida" class="btn-salida">Registrar Salida</a>
    </div>
    <div class="asistence">
      <span>Asistencias recientes </span>
      <div class="table">
        <table>
          <thead>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Entrada</th>
            <th>salida</th>
          </thead>
          <tbody>
            <tr>
              <td></td>
              <td></td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="weck-asistence">
      <label for="perfomance">Rendimiento de esta semana:</label>
      <progress id="perfomance" value="70" max="100"></progress>
    </div>

    <div id="registro-entrada" class="modal-master">
      <a href="#" class="modal-backdrop"></a>
      <div class="modal-box">
        <a href="#" class="close-x">x</a>
        <div class="modal-header">
          <i class="fa-solid fa-right-to-bracket"></i>
          <h2>Registro de Entrada</h2>
        </div>
        <form action="#" method="POST">
          <div class="input-group">
            <label>Cédula de Identidad</label>
            <input type="number" name="cedula" placeholder="Ej: 27123456" />
          </div>
          <div class="input-group">
            <label>Nombre y Apellido</label>
            <input
              type="text"
              name="nombre_completo"
              placeholder="Nombre del trabajador"
            />
          </div>
          <div class="input-group">
            <label>Cargo</label>
            <select name="carga">
              <option value="" disabled selected>Seleccione área...</option>
              <option value="tecnico">Tecnico</option>
              <option value="profesional">Profesional</option>
              <option value="jefe_div">Jefe de division</option>
              <option value="cont">Cont-PI</option>
              <option value="director">Director Estadal</option>
            </select>
          </div>
          <button type="submit" class="confirm-btn in">
            Confirmar Entrada
          </button>
        </form>
      </div>
    </div>

    <div id="registro-salida" class="modal-master">
      <a href="#" class="modal-backdrop"></a>
      <div class="modal-box out">
        <a href="#" class="close-x">&times;</a>
        <div class="modal-header">
          <h2>Finalizar Jornada</h2>
        </div>
        <form action="#" method="POST">
          <p>Ingrese su cédula para registrar la hora de salida oficial.</p>
          <div class="input-group">
            <label>Cédula de Identidad</label>
            <input
              type="number"
              name="cedula"
              placeholder="Ingrese CI para marcar salida"
            />
          </div>
          <div class="input-group">
            <label>Observaciones (Opcional)</label>
            <textarea
              name="nota"
              placeholder="Alguna novedad en el turno..."
            ></textarea>
          </div>
          <button type="submit" class="confirm-btn out">
            Confirmar Salida
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
