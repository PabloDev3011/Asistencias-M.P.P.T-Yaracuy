<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="sources/css/log_styles.css" />
    <script src="sources/js/sweetalert2.all.min.js"></script>
    <script src="sources/js/validacion_usuario.js"></script>
    <title>Inicio de sesión MMPTY</title>
  </head>

  <body>
    <main class="login_container">
      <img src="sources/img/MPP_Transporte-v5.jpg" alt="logo" id="logo_img" />
      <h1>Inicio de sesión</h1>

      <div class="form">
        <form
          action="home.html"
          name="login"
          onsubmit="return validar_usr(this);"
        >
          <div class="user">
            <img src="sources/img/icon/user.png" alt="user" id="user-img" />
            <input
              placeholder="Usuario"
              type="text"
              maxlength="20"
              name="usuario"
              class="input_field"
              id="usuario_input"
              autocomplete="off"
            />
          </div>

          <div class="password">
            <img src="sources/img/icon/lock.png" alt="lock" id="lock-img" />
            <input
              placeholder="Clave"
              type="password"
              name="clave"
              class="input_field"
              maxlength="30"
              id="clave_input"
            />

            <input
              type="checkbox"
              onclick="clave_input.type = this.checked ? 'text' : 'password'"
              id="show_password"
            />

            <label for="show_password" class="check_icon">
              <img
                src="sources/img/icon/eye_close.png"
                alt="eye_close"
                id="eye-closed"
              />
              <img src="sources/img/icon/eye.png" alt="eye" id="eye-open" />
            </label>

            <a href="#" class="forgot_link">¿Olvidó su contraseña?</a>
          </div>

          <input type="submit" value="Entrar" class="login_btn" />
        </form>
      </div>
    </main>
    <span>v1.0 | Proyecto MPPT © 2026</span>
  </body>
</html>
